plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

version = '1.0.0'
group = 'com.example.permscmds'

base {
    archivesName = 'permscmds-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                permscmds {
                    source sourceSets.main
                }
            }
        }
        client { }
        server { args '--nogui' }
    }
}

// Proyecto "plano": todos los .java y los recursos estan en la raiz (sin carpetas).
sourceSets {
    main {
        java {
            srcDirs = ['.']
            include '*.java'
        }
        resources {
            srcDirs = []
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.20'
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'mod_version', project.version
    from('mods.toml') {
        into 'META-INF'
        expand(mod_version: project.version)
    }
    from('pack.mcmeta')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : 'permscmds',
            'Implementation-Version': project.jar.archiveVersion
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
